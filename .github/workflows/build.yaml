name: Go Pong Windows x86 Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-win-x86:
    runs-on: ubuntu-latest
    # Анти-бот защита (Исправлены кавычки)
    if: github.actor != 'dependabot[bot]' && github.actor != 'github-actions[bot]' && !contains(github.actor, '[bot]')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    # Автоматическая инициализация модуля, если файла go.mod еще нет в репозитории
    - name: Initialize Go Module and Install dependencies
      run: |
        if [ ! -f go.mod ]; then
          go mod init pong_Go
        fi
        # go mod tidy сам скачает все импортированные в коде зависимости
        go mod tidy

    # Кросс-компиляция под Windows 32-bit (386) с оптимизацией размера
    - name: Build Pong Game (Windows x86)
      env:
        GOOS: windows
        GOARCH: "386"
        CGO_ENABLED: 0
      run: |
        # Если у вас стандартная структура, лучше не указывать main.go принудительно, 
        # чтобы go build сам собрал пакет из текущей директории.
        go build -ldflags="-s -w" -o pong_windows_x86.exe

    # Загрузка готового .exe артефакта
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pong-windows-x86-exe
        path: pong_windows_x86.exe
