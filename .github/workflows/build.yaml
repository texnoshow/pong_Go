name: Go Pong Multiplatform Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    # Анти-бот защита (Anti-bot / Anti auto-build)
    if: github.actor != 'dependabot[bot]' && github.actor != 'github-actions[bot]' && contains(github.actor, '[bot]') == false

    strategy:
      matrix:
        include:
          - os: windows
            arch: amd64
            ext: ".exe"
          - os: windows
            arch: "386"
            ext: ".exe"
          - os: darwin
            arch: amd64
            ext: ""

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Install dependencies
      run: |
        go mod tidy

    # Кросс-компиляция с оптимизацией размера бинарника
    - name: Build Pong Game
      env:
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
      run: |
        go build -ldflags="-s -w" -o pong_${{ matrix.os }}_${{ matrix.arch }}${{ matrix.ext }} main.go

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pong-${{ matrix.os }}-${{ matrix.arch }}
        path: pong_${{ matrix.os }}_${{ matrix.arch }}${{ matrix.ext }}
